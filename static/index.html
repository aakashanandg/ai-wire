<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Wire</title>
<meta name="description" content="System design and AI system design deep dives from company engineering blogs, updated every 30 minutes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Palette after tdd.cat (The Daily Diff): newsprint cream + oxblood, or warm charcoal + amber. */
:root {
  --bg: #f8f4e8; --surface: #fffdf6; --surface-2: #efe8d4;
  --text: #1b1a17; --muted: #45423a; --faint: #7c7563;
  --line: rgba(32, 30, 25, .14); --rule: #201e19;
  --accent: #8a1f11; --accent-soft: rgba(138, 31, 17, .08);
  --serif: "Source Serif 4", Georgia, serif;
  --sans: "DM Sans", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17150f; --surface: #221f19; --surface-2: #2a2520;
    --text: #d9d0bd; --muted: #b0a790; --faint: #7f7663;
    --line: rgba(217, 208, 189, .12); --rule: #b0a790;
    --accent: #cc9a56; --accent-soft: rgba(204, 154, 86, .14);
  }
}
:root[data-theme="dark"] {
  --bg: #17150f; --surface: #221f19; --surface-2: #2a2520;
  --text: #d9d0bd; --muted: #b0a790; --faint: #7f7663;
  --line: rgba(217, 208, 189, .12); --rule: #b0a790;
  --accent: #cc9a56; --accent-soft: rgba(204, 154, 86, .14);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
::selection { background: var(--accent-soft); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

/* Masthead */
header { border-bottom: 3px double var(--rule); }
.bar { display: flex; align-items: center; gap: 14px; padding: 22px 0 16px; }
.logo { font: 700 30px/1 var(--serif); letter-spacing: -0.015em; white-space: nowrap; }
.logo span { color: var(--accent); }
.tagline { color: var(--faint); font-size: 13.5px; margin-top: 6px; }
.search { flex: 1; max-width: 340px; margin-left: auto; position: relative; }
.search input { width: 100%; height: 38px; padding: 0 12px 0 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search svg { position: absolute; left: 11px; top: 11px; color: var(--faint); }
.icon-btn { height: 38px; width: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { color: var(--text); }

/* Source filter */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 0 14px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.chip b { font-weight: 500; color: var(--faint); font-size: 11.5px; }
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.chip[aria-pressed="true"] b { color: inherit; opacity: .7; }
.chip.err { text-decoration: line-through; opacity: .6; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }

/* Sections of cards */
main { padding-bottom: 56px; }
.cat-nav { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 16px 0 0; font-size: 13px; }
.cat-nav a { color: var(--muted); border-bottom: 1px dotted var(--faint); }
.cat-nav a:hover { color: var(--accent); border-color: var(--accent); }
.cat-nav a b { font-weight: 500; color: var(--faint); margin-left: 3px; }
.cat { margin-top: 30px; scroll-margin-top: 16px; }
.cat-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1px solid var(--rule); }
.cat-head h2 { margin: 0; font: 700 24px/1.2 var(--serif); letter-spacing: -0.01em; }
.cat-head h2 .n { font: 500 13px var(--sans); color: var(--faint); margin-left: 4px; }
.cat-head p { margin: 3px 0 0; color: var(--faint); font-size: 13px; }
.more { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 12.5px; color: var(--muted); }
.more:hover { color: var(--accent); border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; transition: border-color .15s, transform .15s; }
.card::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--c); opacity: .85; }
.card:hover { border-color: var(--faint); transform: translateY(-1px); }
.meta { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.new { background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; }
.title { font: 600 17.5px/1.3 var(--serif); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card:hover .title { color: var(--accent); }
.summary { color: var(--muted); font-size: 13.5px; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tag { margin-top: auto; align-self: flex-start; font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.empty { padding: 48px 0; color: var(--muted); text-align: center; }
footer { color: var(--faint); font-size: 12.5px; padding: 0 0 40px; }
footer .bad { color: var(--accent); }

@media (max-width: 600px) {
  .wrap { padding: 0 16px; }
  .bar { flex-wrap: wrap; padding: 16px 0 12px; }
  .logo { font-size: 25px; }
  .bar > div:first-child { flex: 1 1 0; min-width: 0; }  /* theme button stays beside the logo */
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .icon-btn { margin-left: auto; }
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <div>
        <div class="logo">AI <span>Wire</span></div>
        <div class="tagline">System design &amp; AI system design, from the engineering blogs</div>
      </div>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search posts…" autocomplete="off" aria-label="Search posts">
      </label>
      <button class="icon-btn" id="theme" title="Switch light / dark" aria-label="Switch light or dark theme">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <nav class="chips" id="sources" aria-label="Filter by engineering blog"></nav>
  </div>
</header>

<main class="wrap" id="feed" aria-live="polite"><div class="empty">Loading…</div></main>
<footer class="wrap" id="status"></footer>

<script>
// Two ways to run: `python server.py` (live API) or the static build from build.py (GitHub Pages).
const STATIC = window.AIWIRE_STATIC === true;
const NEWS_URL = STATIC ? "data/news.json" : "api/news";

const ORG_COLORS = {
  "Anthropic": "#d97757", "Meta": "#0866ff", "Netflix": "#e50914", "Cloudflare": "#f38020", "GitHub": "#8b949e",
  "Airbnb": "#ff5a5f", "Dropbox": "#0061fe", "Slack": "#e01e5a", "Pinterest": "#e60023",
  "Shopify": "#95bf47", "Spotify": "#1db954", "AWS": "#ff9900", "Databricks": "#ff3621",
  "LangChain": "#2f8f83", "InfoQ": "#2f6fdb",
};
const SECTIONS = [
  ["system-design", "System design", "Architecture, databases, scaling, reliability and performance"],
  ["ai", "AI system design", "Agents, RAG, evals, LLM apps, inference and serving"],
];
const PER_SECTION = 9;

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "#";
const when = (p) => new Date(p.date || p.first_seen);
const color = (org) => ORG_COLORS[org] || "var(--faint)";
const sectionOf = (p) => (p.topics || []).find((t) => SECTIONS.some(([id]) => id === t)) || "system-design";

let data = { posts: [], sources: [] };
let org = store.get("aiwire.org", "all");
const expanded = new Set();
const lastVisit = store.get("ainews.lastVisit", null);
store.set("ainews.lastVisit", new Date().toISOString());
const isNew = (p) => lastVisit && p.first_seen && new Date(p.first_seen) > new Date(lastVisit);

function ago(d) {
  const s = (Date.now() - d) / 1000;
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  if (s < 86400 * 7) return `${Math.round(s / 86400)}d ago`;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function renderSources() {
  const failed = new Set(data.sources.filter((s) => !s.ok).map((s) => s.org));
  const count = (o) => data.posts.filter((p) => p.org === o).length;
  const orgs = [...new Set(data.sources.map((s) => s.org))].sort((a, b) => count(b) - count(a));
  $("sources").innerHTML = `<button class="chip" data-org="all" aria-pressed="${org === "all"}">All blogs <b>${data.posts.length}</b></button>` +
    orgs.map((o) => `<button class="chip${failed.has(o) ? " err" : ""}" data-org="${esc(o)}" aria-pressed="${org === o}">
      <span class="dot" style="background:${color(o)}"></span>${esc(o)} <b>${count(o)}</b></button>`).join("");
}

function card(p) {
  const d = when(p);
  const second = (p.topics || []).filter((t) => t !== sectionOf(p) && SECTIONS.some(([id]) => id === t));
  return `<a class="card" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener" style="--c:${color(p.org)}">
    <div class="meta"><span class="dot" style="background:${color(p.org)}"></span><span>${esc(p.source_name)}</span><span>·</span>
      <time datetime="${d.toISOString()}">${ago(d)}</time>${isNew(p) ? '<span class="new">New</span>' : ""}</div>
    <h3 class="title">${esc(p.title)}</h3>
    ${p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ""}
    ${second.length ? `<span class="tag">Also: ${esc(SECTIONS.find(([id]) => id === second[0])[1])}</span>` : ""}
  </a>`;
}

function renderFeed() {
  const q = $("q").value.trim().toLowerCase();
  const posts = data.posts
    .filter((p) => (org === "all" || p.org === org))
    .filter((p) => !q || `${p.title} ${p.summary} ${p.source_name}`.toLowerCase().includes(q))
    .sort((a, b) => when(b) - when(a));
  if (!posts.length) { $("feed").innerHTML = `<div class="empty">${data.posts.length ? "No posts match." : "No posts yet."}</div>`; return; }

  const sections = SECTIONS.map(([id, label, blurb]) => ({ id, label, blurb, posts: posts.filter((p) => sectionOf(p) === id) })).filter((s) => s.posts.length);
  $("feed").innerHTML =
    `<nav class="cat-nav" aria-label="Jump to a section">${sections.map((s) => `<a href="#cat-${s.id}" data-jump="${s.id}">${s.label} <b>${s.posts.length}</b></a>`).join("")}</nav>` +
    sections.map((s) => {
      const open = q || expanded.has(s.id);
      const shown = open ? s.posts : s.posts.slice(0, PER_SECTION);
      return `<section class="cat" id="cat-${s.id}">
        <div class="cat-head"><div><h2>${s.label} <span class="n">${s.posts.length}</span></h2><p>${s.blurb}</p></div>
          ${s.posts.length > PER_SECTION && !q ? `<button class="more" data-expand="${s.id}">${open ? "Show less" : `Show all ${s.posts.length}`}</button>` : ""}</div>
        <div class="cards">${shown.map(card).join("")}</div></section>`;
    }).join("");
}

function renderStatus() {
  const bad = data.sources.filter((s) => !s.ok);
  $("status").innerHTML = `${data.updated ? "Updated " + ago(new Date(data.updated)) : ""} · ${data.sources.length} engineering blogs · refreshed every 30 minutes` +
    (bad.length ? ` · <span class="bad">${bad.length} unavailable: ${esc(bad.map((s) => s.name).join(", "))}</span>` : "");
}

$("sources").addEventListener("click", (e) => {
  const b = e.target.closest("[data-org]");
  if (!b) return;
  org = b.dataset.org; store.set("aiwire.org", org);
  renderSources(); renderFeed();
});
$("feed").addEventListener("click", (e) => {
  const x = e.target.closest("[data-expand]");
  if (x) {
    const id = x.dataset.expand;
    expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    renderFeed();
    if (!expanded.has(id)) $("cat-" + id)?.scrollIntoView({ block: "start" });
    return;
  }
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); $("cat-" + j.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" }); }
});
$("q").addEventListener("input", renderFeed);
$("theme").addEventListener("click", () => {
  const dark = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#17150f";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  store.set("aiwire.theme", document.documentElement.dataset.theme);
});
document.documentElement.dataset.theme = store.get("aiwire.theme", "dark");

async function load() {
  const res = await fetch(NEWS_URL, { cache: "no-cache" });
  if (!res.ok) throw new Error(res.status);
  data = await res.json();
  data.posts = data.posts.filter((p) => p.group === "engineering");
  if (org !== "all" && !data.posts.some((p) => p.org === org)) org = "all";
  renderSources(); renderFeed(); renderStatus();
}
load().catch(() => { $("feed").innerHTML = `<div class="empty">Couldn't load the posts. Try reloading the page.</div>`; });
setInterval(() => load().catch(() => {}), 5 * 60 * 1000);
</script>
</body>
</html>
