<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Wire Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg: #fbfaf7; --text: #22201c; --muted: #7c776c; --line: #e8e4da; --accent: #2f5d50; --soft: #eef3f0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #161513; --text: #ebe7df; --muted: #9d978b; --line: #2b2925; --accent: #8cc7b5; --soft: #1e2623; }
}
:root[data-theme="dark"] { --bg: #161513; --text: #ebe7df; --muted: #9d978b; --line: #2b2925; --accent: #8cc7b5; --soft: #1e2623; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 Inter, system-ui, sans-serif; }
a { color: inherit; }
.wrap { max-width: 680px; margin: 0 auto; padding: 56px 24px 80px; }
.kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
h1 { font: 600 44px/1.1 Fraunces, Georgia, serif; margin: 8px 0 10px; letter-spacing: -0.02em; }
.lede { color: var(--muted); margin: 0 0 12px; font-size: 17px; }
.range { display: flex; gap: 6px; margin: 20px 0 8px; }
.range button { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 4px 12px; font: 13px Inter; cursor: pointer; }
.range button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--soft); }
h2 { font: 600 22px/1.3 Fraunces, Georgia, serif; margin: 44px 0 6px; display: flex; align-items: baseline; gap: 10px; }
h2 .n { font: 13px Inter; color: var(--muted); }
h2 .sw { width: 9px; height: 9px; border-radius: 50%; align-self: center; }
ul { list-style: none; padding: 0; margin: 0; }
li { padding: 12px 0; border-bottom: 1px solid var(--line); }
li a { text-decoration: none; font-weight: 500; }
li a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
li .s { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
li .d { color: var(--muted); font-size: 12.5px; }
.new { color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: .05em; margin-left: 6px; }
.top { background: var(--soft); border-radius: 14px; padding: 8px 22px 12px; margin-top: 28px; }
.top h2 { margin-top: 16px; }
.top li:last-child { border-bottom: 0; }
.top .pts { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 8px; }
.quiet { color: var(--muted); font-style: italic; }
footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
@media (max-width: 600px) { .wrap { padding: 36px 16px 60px; } h1 { font-size: 34px; } }
</style>
</head>
<body>
<article class="wrap">
  <div class="kicker">AI Wire · Daily digest</div>
  <h1 id="title">Loading…</h1>
  <p class="lede" id="lede"></p>
  <div class="range" id="range"></div>
  <div id="body"></div>
  <footer id="foot"></footer>
</article>
<script src="common.js"></script>
<script>
const { esc, safeUrl, when, isNew, color, host, ago, load, store } = AIW;
let data, days = store.get("ainews.digestDays", 3);

function render() {
  const since = Date.now() - days * 86400000;
  const recent = data.labs.filter((p) => when(p) >= since);
  const hn = data.hn.filter((p) => when(p) >= Math.min(since, Date.now() - 2 * 86400000)).slice(0, 5);
  const byOrg = data.orgs.map((o) => [o, recent.filter((p) => p.org === o)]).filter(([, ps]) => ps.length).sort((a, b) => b[1].length - a[1].length);
  const quiet = data.orgs.filter((o) => !byOrg.some(([x]) => x === o));

  document.getElementById("title").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  document.getElementById("lede").textContent = recent.length
    ? `${recent.length} new posts from ${byOrg.length} AI labs in the last ${days === 1 ? "day" : days + " days"}. Most active: ${byOrg.slice(0, 3).map(([o]) => o).join(", ")}.`
    : `Nothing new from the labs in the last ${days === 1 ? "day" : days + " days"}.`;
  document.getElementById("range").innerHTML = [1, 3, 7, 30].map((d) =>
    `<button data-d="${d}" aria-pressed="${d === days}">${d === 1 ? "24 hours" : d + " days"}</button>`).join("");

  let html = hn.length ? `<section class="top"><h2>Top of Hacker News</h2><ul>${hn.map((p) =>
    `<li><span class="pts">${p.points}</span><a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">${esc(p.title)}</a>
     <div class="d">${esc(host(p.url))} · <a href="${esc(safeUrl(p.discussion))}" target="_blank" rel="noopener">${p.comments} comments</a></div></li>`).join("")}</ul></section>` : "";
  for (const [org, ps] of byOrg) {
    html += `<h2><span class="sw" style="background:${color(org)}"></span>${esc(org)}<span class="n">${ps.length}</span></h2><ul>${ps.map((p) =>
      `<li><a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">${esc(p.title)}</a>${isNew(p) ? '<span class="new">NEW</span>' : ""}
       ${p.summary ? `<div class="s">${esc(p.summary)}</div>` : ""}<div class="d">${esc(p.source_name)} · ${ago(when(p))}</div></li>`).join("")}</ul>`;
  }
  if (quiet.length) html += `<p class="quiet" style="margin-top:36px">Quiet: ${esc(quiet.join(", "))}.</p>`;
  document.getElementById("body").innerHTML = html;
  document.getElementById("foot").textContent = `Updated ${ago(new Date(data.updated))} ago from ${data.sources.length} sources.`;
}
document.getElementById("range").addEventListener("click", (e) => {
  const b = e.target.closest("[data-d]"); if (!b) return;
  days = +b.dataset.d; store.set("ainews.digestDays", days); render();
});
if (store.get("ainews.theme", null)) document.documentElement.dataset.theme = store.get("ainews.theme");
load().then((d) => { data = d; render(); });
</script>
</body>
</html>
