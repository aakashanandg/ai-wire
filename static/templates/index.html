<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Wire Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #f3f3f1; --card: #fff; --text: #18181b; --muted: #71717a; --line: #e4e4e7; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f0f11; --card: #18181b; --text: #f4f4f5; --muted: #a1a1aa; --line: #27272a; }
}
:root[data-theme="dark"] { --bg: #0f0f11; --card: #18181b; --text: #f4f4f5; --muted: #a1a1aa; --line: #27272a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 40px 24px 64px; }
h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.02em; }
.lede { color: var(--muted); margin: 0 0 32px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }
.t { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.shot { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--bg); }
/* Render each template at desktop size, then scale it down to fit the card. */
.shot iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; pointer-events: none; }
.shot a { position: absolute; inset: 0; }
.info { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.info h2 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.num { width: 22px; height: 22px; border-radius: 6px; background: var(--text); color: var(--bg); font-size: 12px; display: inline-grid; place-items: center; }
.cur { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.info p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.best { font-size: 13px; }
.best b { font-weight: 600; }
.open { align-self: flex-start; margin-top: 8px; font-size: 14px; font-weight: 500; color: var(--text); text-decoration: none; border: 1px solid var(--line); padding: 6px 14px; border-radius: 8px; }
.open:hover { background: var(--bg); }
@media (max-width: 600px) { .wrap { padding: 28px 16px 48px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pick a template</h1>
  <p class="lede">Five layouts for AI Wire, each showing your live data. Open one to try it, then tell Claude which one to make the main page.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const TEMPLATES = [
  { n: 1, name: "Editorial", url: "/", current: true,
    desc: "Serif headlines in a reading column, grouped by day, with trending Hacker News stories in a side panel.",
    best: "Reading carefully once or twice a day" },
  { n: 2, name: "Terminal", url: "/templates/terminal.html",
    desc: "Dense monospace list in the style of Hacker News. Keyboard driven: j/k to move, o to open, / to search.",
    best: "Scanning 100+ headlines fast" },
  { n: 3, name: "Magazine", url: "/templates/magazine.html",
    desc: "A large lead story and a grid of color-coded cards, with a separate Hacker News section below.",
    best: "A visual front page to browse" },
  { n: 4, name: "Columns", url: "/templates/columns.html",
    desc: "A TweetDeck-style dashboard with one scrolling column per lab and Hacker News, busiest labs first.",
    best: "Following every lab side by side on a wide screen" },
  { n: 5, name: "Digest", url: "/templates/digest.html",
    desc: "A calm newsletter-style briefing: top Hacker News stories, then what each lab published in the last 1 to 30 days.",
    best: "A quick 'what did I miss?' catch-up" },
];

document.getElementById("grid").innerHTML = TEMPLATES.map((t) => `
  <article class="t">
    <div class="shot"><iframe src="${t.url}" loading="lazy" tabindex="-1" title="${t.name} preview"></iframe>
      <a href="${t.url}" target="_blank" aria-label="Open ${t.name}"></a></div>
    <div class="info">
      <h2><span class="num">${t.n}</span>${t.name}${t.current ? '<span class="cur">Current</span>' : ""}</h2>
      <p>${t.desc}</p>
      <div class="best"><b>Best for:</b> ${t.best}</div>
      <a class="open" href="${t.url}" target="_blank">Open ${t.name} →</a>
    </div>
  </article>`).join("");

function fit() {
  document.querySelectorAll(".shot").forEach((s) => {
    s.querySelector("iframe").style.transform = `scale(${s.clientWidth / 1280})`;
  });
}
addEventListener("resize", fit);
fit();
</script>
</body>
</html>
